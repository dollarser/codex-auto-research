[project]
name = "auto-research-agent"
version = "0.5.0"
description = "Native App Server Goal research with detached experiment monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=15",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
iris = ["scikit-learn>=1.5"]
watcher = ["watchfiles>=1.0"]

[project.scripts]
auto-research = "auto_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_research"]
